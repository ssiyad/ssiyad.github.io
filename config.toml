# The URL the site will be built for
base_url = "https://ssiyad.com"

# The theme to use (if any)
theme = "block"

# The site title and description; used in feeds by default.
title = "Sabu Siyad's Blog"
description = "Thoughts, stories and ideas."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# The Search page filters posts in the browser and needs no index
build_search_index = false

# Shows the RSS button on the posts page
generate_feeds = true

[markdown.highlighting]
light_theme = "gruvbox-light-medium"
dark_theme = "gruvbox-dark-medium"

[extra]
posts_section = "posts/_index.md"
home_posts = 7
menu = [
  { name = "Home", url = "/" },
  { name = "Posts", url = "/posts/" },
  { name = "Projects", url = "/projects/" },
  { name = "Search", url = "/search/" },
]

[extra.intro]
kicker = "Sabu Siyad's blog"
greeting = "Hello, I am"
name = "Sabu Siyad"
role = "Security Engineer at [Frappe](https://frappe.io)."
avatar_url = "https://avatars.githubusercontent.com/u/28098330?s=640"
links = [
  { name = "GitHub", url = "https://github.com/ssiyad" },
  { name = "LinkedIn", url = "https://www.linkedin.com/in/ssiyad/" },
  { name = "Telegram", url = "https://t.me/ssiyad" },
  { name = "Bluesky", url = "https://bsky.app/profile/ssiyad.com" },
]

[extra.github]
username = "ssiyad"
repos = [
  { name = "block", note = "Zola theme" },
  { name = "ssiyad.github.io", note = "this site" },
]

[extra.bluesky]
handle = "ssiyad.com"

[extra.footer]
license_text = "The content for this site is [CC-BY-SA](https://creativecommons.org/licenses/by-sa/2.0/). The [code for this site](https://github.com/ssiyad/ssiyad.github.io) is [GPLv3](https://www.gnu.org/licenses/gpl-3.0.en.html)."
source_url = "https://github.com/ssiyad/ssiyad.github.io"
