name: Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: write

# Each deploy force-pushes gh-pages, so only the newest push may run.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The site has no build step. Copy the served files only, so the
      # README, LICENSE and workflow stay off the site.
      - name: Collect site files
        run: |
          mkdir public
          cp CNAME *.html *.css *.js public/
          touch public/.nojekyll
      - name: Deploy to gh-pages
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com"
          git push -f "${REMOTE}/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
